version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: prose-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/prosetrail.com:/etc/letsencrypt/live/prosetrail.com:ro
      - /etc/letsencrypt/archive/prosetrail.com:/etc/letsencrypt/archive/prosetrail.com:ro
      - covers:/usr/share/nginx/html/covers
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prose-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - covers:/app/frontend/public/covers
    restart: always

volumes:
  covers:
